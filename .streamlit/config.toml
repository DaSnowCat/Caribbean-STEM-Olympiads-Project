#Theme color for the pages of the app
#This file is where the colours of the pages come from. 
#This is temporary and will use CSS later down in our development.

[theme]
base = "light"
textColor="#024102"
linkColor="#65edff"
backgroundColor = "#ddfdb0"
primaryColor = "#ff0090"
secondaryBackgroundColor = "#cce5fd"
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito"
baseRadius = "medium"
buttonRadius = "full"
borderColor = "#00591e"

